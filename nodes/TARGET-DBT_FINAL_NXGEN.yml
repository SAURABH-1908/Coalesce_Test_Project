name: DBT_FINAL_NXGEN
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'GBL_ADDRESS_DIM') }} TARGET
      USING {{ ref('TARGET', 'DBT_FINAL_NXGEN') }} SOURCE
          ON TO_VARCHAR(SOURCE.GBL_ADDRESS_INTG_ID) = TO_VARCHAR(TARGET.GBL_ADDRESS_INTG_ID)
         AND TO_VARCHAR(TO_NUMBER(SOURCE.ADDRESS_SK)) = TARGET.ADDRESS_SK
         AND SOURCE.SYS_EFF_TS = TARGET.SYS_EFF_TS
      WHEN MATCHED AND TARGET.SYS_EXP_TS IS NULL AND SOURCE.DML_ACTION_TYPE_CD IN ('D','U')
          THEN UPDATE SET
              SYS_EXP_TS = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
              CURR_FLG = SOURCE.CURR_FLG,
              DML_ACTION_TYPE_CD = SOURCE.DML_ACTION_TYPE_CD
      WHEN NOT MATCHED AND SOURCE.DML_ACTION_TYPE_CD = 'I'
          THEN INSERT (
              ADDRESS_SK, GBL_ADDRESS_INTG_ID, SOURCE_ADDRESS_CD, REFERENCE_TYPE_NM, ADDRESS_LINE_1,
              ADDRESS_LINE_2, ADDRESS_LINE_3, ADDRESS_CITY_NM, ADDRESS_STATE_CD, ADDRESS_COUNTRY_NM,
              ADDRESS_POSTAL_CD, ERP_ENTITY_CD, REFERENCE_CD, ACCOUNT_CD, ADDRESS_REGION_CD, ADDRESS_REGION_NM,
              ADDRESS_TYPE_FLG, SOURCE_SYSTEM_SK, CREATE_TS, LAST_UPDATE_TS, SYS_EFF_TS, SYS_EXP_TS,
              INGEST_TS, DL_LAST_UPDATE_TS, CHKSUM_STR, LOAD_TS, DML_ACTION_TYPE_CD, DBT_SCD_ID, CURR_FLG,
              SOURCE_SYSTEM_NM, INSTANCE_NM, ROOT_EXECN_PID, ADF_PIPELINE_NM, ADF_TRANSFORMATION_NM,
              ADF_SCRIPT_NM, BUSINESS_SEGMENT_NM
          )
          VALUES (
              TO_NUMBER(SOURCE.ADDRESS_SK), SOURCE.GBL_ADDRESS_INTG_ID, SOURCE.SOURCE_ADDRESS_CD,
              SOURCE.REFERENCE_TYPE_NM, SOURCE.ADDRESS_LINE_1, SOURCE.ADDRESS_LINE_2, SOURCE.ADDRESS_LINE_3,
              SOURCE.ADDRESS_CITY_NM, SOURCE.ADDRESS_STATE_CD, SOURCE.ADDRESS_COUNTRY_NM, SOURCE.ADDRESS_POSTAL_CD,
              SOURCE.ERP_ENTITY_CD, SOURCE.REFERENCE_CD, SOURCE.ACCOUNT_CD, SOURCE.ADDRESS_REGION_CD,
              SOURCE.ADDRESS_REGION_NM, SOURCE.ADDRESS_TYPE_FLG, SOURCE.SOURCE_SYSTEM_SK, SOURCE.CREATE_TS,
              SOURCE.LAST_UPDATE_TS, SOURCE.SYS_EFF_TS, SOURCE.SYS_EXP_TS, SOURCE.INGEST_TS,
              SOURCE.DL_LAST_UPDATE_TS, SOURCE.CHKSUM_STR, SOURCE.LOAD_TS, SOURCE.DML_ACTION_TYPE_CD,
              SOURCE.DBT_SCD_ID, SOURCE.CURR_FLG, SOURCE.SOURCE_SYSTEM_NM, SOURCE.INSTANCE_NM,
              NULL, '${adf_pipeline_nm}', '${adf_datafactory_nm}',
              'otc-finance/NA/NxGen/LOAD_FNL_NXGEN_GBL_ADDRESS_DIM.sql', 'Americas'
          );
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
  database: ""
  deployEnabled: true
