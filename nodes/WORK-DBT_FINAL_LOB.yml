name: DBT_FINAL_LOB
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'LINE_OF_BUSINESS_DIM') }} AS DBT_INTERNAL_DEST
      USING {{ ref('WORK', 'DBT_FINAL_LOB') }} AS DBT_INTERNAL_SOURCE
          ON TO_VARCHAR(DBT_INTERNAL_SOURCE.TARGET_PRIMARY_KEY) = TO_VARCHAR(DBT_INTERNAL_DEST.LINE_OF_BUSINESS_INTG_ID)
         AND TO_VARCHAR(TO_NUMBER(DBT_INTERNAL_SOURCE.LINE_OF_BUSINESS_SK)) = DBT_INTERNAL_DEST.LINE_OF_BUSINESS_SK
         AND DBT_INTERNAL_SOURCE.SYS_EFF_TS = DBT_INTERNAL_DEST.SYS_EFF_TS

      WHEN MATCHED
           AND DBT_INTERNAL_DEST.SYS_EXP_TS IS NULL
           AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD IN ('D','U')
      THEN UPDATE SET
          SYS_EXP_TS         = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
          CURR_FLG           = DBT_INTERNAL_SOURCE.CURR_FLG,
          DML_ACTION_TYPE_CD = DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD

      WHEN NOT MATCHED
           AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD = 'I'
      THEN INSERT (
          LINE_OF_BUSINESS_SK, LINE_OF_BUSINESS_INTG_ID, SOURCE_LINE_OF_BUSINESS_CD,
          LINE_OF_BUSINESS_NM, LINE_OF_BUSINESS_TYPE_NM, ERP_ENTITY_CD, SOURCE_SYSTEM_SK,
          CREATE_TS, LAST_UPDATE_TS, SYS_EFF_TS, SYS_EXP_TS, INGEST_TS, DL_LAST_UPDATE_TS,
          CHKSUM_STR, LOAD_TS, DML_ACTION_TYPE_CD, DBT_SCD_ID, CURR_FLG, SOURCE_SYSTEM_NM,
          INSTANCE_NM, ADF_PIPELINE_NM, ADF_TRANSFORMATION_NM, ADF_SCRIPT_NM,
          BUSINESS_SEGMENT_NM, ROOT_EXECN_PID
      )
      VALUES (
          TO_NUMBER(DBT_INTERNAL_SOURCE.LINE_OF_BUSINESS_SK), DBT_INTERNAL_SOURCE.LINE_OF_BUSINESS_INTG_ID, DBT_INTERNAL_SOURCE.SOURCE_LINE_OF_BUSINESS_CD,
          DBT_INTERNAL_SOURCE.LINE_OF_BUSINESS_NM, DBT_INTERNAL_SOURCE.LINE_OF_BUSINESS_TYPE_NM, DBT_INTERNAL_SOURCE.ERP_ENTITY_CD, DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_SK,
          DBT_INTERNAL_SOURCE.CREATE_TS, DBT_INTERNAL_SOURCE.LAST_UPDATE_TS, DBT_INTERNAL_SOURCE.SYS_EFF_TS, DBT_INTERNAL_SOURCE.SYS_EXP_TS, DBT_INTERNAL_SOURCE.INGEST_TS, DBT_INTERNAL_SOURCE.DL_LAST_UPDATE_TS,
          DBT_INTERNAL_SOURCE.CHKSUM_STR, DBT_INTERNAL_SOURCE.LOAD_TS, DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD, DBT_INTERNAL_SOURCE.DBT_SCD_ID, DBT_INTERNAL_SOURCE.CURR_FLG, DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_NM,
          DBT_INTERNAL_SOURCE.INSTANCE_NM, '${adf_pipeline_nm}', '${adf_datafactory_nm}', 'otc-finance/NA/BAAN_V_525/LOAD_FNL_BAAN_V_525_LINE_OF_BUSINESS_DIM.sql',
          'Americas', NULL
      );
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
  database: ""
  deployEnabled: true
  description: Final union of insertion, update and delete action rows for BAAN V_525 line of business, feeding the LINE_OF_BUSINESS_DIM merge.
