operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'GL_DISTIBUTION_FACT') }} AS DBT_INTERNAL_DEST
      USING {{ ref('WORK', 'DBT_FINAL_535') }} AS SOURCE
        ON TO_VARCHAR(DBT_INTERNAL_DEST.GL_DISTR_INTG_ID) = TO_VARCHAR(SOURCE.GL_DISTR_INTG_ID)
        AND DBT_INTERNAL_DEST.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_003'
        AND DBT_INTERNAL_DEST.INSTANCE_NM = 'INSTANCE_004'
      WHEN MATCHED AND SOURCE.CURR_FLG = 'Y' AND DBT_INTERNAL_DEST.CHKSUM_STR != SOURCE.CHKSUM_STR THEN
      UPDATE SET
        GL_DISTR_INTG_ID            = SOURCE.GL_DISTR_INTG_ID,
        CURRENCY_SK                 = SOURCE.CURRENCY_SK,
        SOURCE_SYSTEM_SK            = SOURCE.SOURCE_SYSTEM_SK,
        INVOICE_NO                  = SOURCE.INVOICE_NO,
        CUSTOMER_NBR                = SOURCE.CUSTOMER_NBR,
        GL_ACCOUNT_SK               = SOURCE.GL_ACCOUNT_SK,
        BRANCH_CD                   = SOURCE.BRANCH_CD,
        GL_TRANSACTION_AMT          = SOURCE.GL_TRANSACTION_AMT,
        GL_TRANSACTION_DT           = SOURCE.GL_TRANSACTION_DT,
        ACC_PERIOD_YEAR             = SOURCE.ACC_PERIOD_YEAR,
        GL_PERIOD_NBR               = SOURCE.GL_PERIOD_NBR,
        GL_PERIOD_YR                = SOURCE.GL_PERIOD_YR,
        FISCAL_YEAR_NBR             = SOURCE.FISCAL_YEAR_NBR,
        COST_CENTER_ID              = SOURCE.COST_CENTER_ID,
        CURRENCY_CD                 = SOURCE.CURRENCY_CD,
        TRANSACTION_TYPE_DSC        = SOURCE.TRANSACTION_TYPE_DSC,
        LINE_DSC                    = SOURCE.LINE_DSC,
        ACCOUNTED_CREDIT_AMT        = SOURCE.ACCOUNTED_CREDIT_AMT,
        ACCOUNTED_DEBIT_AMT         = SOURCE.ACCOUNTED_DEBIT_AMT,
        LINE_CREDIT_AMT             = SOURCE.LINE_CREDIT_AMT,
        LINE_STATUS_CD              = SOURCE.LINE_STATUS_CD,
        SHIP_TO_ACC_ID              = SOURCE.SHIP_TO_ACC_ID,
        BILL_TO_ACC_ID              = SOURCE.BILL_TO_ACC_ID,
        CUST_STATUS_CD              = SOURCE.CUST_STATUS_CD,
        CONTRACT_SK                 = SOURCE.CONTRACT_SK,
        LEDGER_DSC                  = SOURCE.LEDGER_DSC,
        ACCOUNTING_DOC_LINE_ID      = SOURCE.ACCOUNTING_DOC_LINE_ID,
        ACCOUNTING_DOC_ID           = SOURCE.ACCOUNTING_DOC_ID,
        TRANSACTION_REFERENCE_ID    = SOURCE.TRANSACTION_REFERENCE_ID,
        ENTITY_CD                   = SOURCE.ENTITY_CD,
        LEDGER_CURRENCY_CD          = SOURCE.LEDGER_CURRENCY_CD,
        CONTRACT_NBR_ID             = SOURCE.CONTRACT_NBR_ID,
        ENTITY_SK                   = SOURCE.ENTITY_SK,
        GL_ACCOUNT_CD               = SOURCE.GL_ACCOUNT_CD,
        GL_TRANSACTION_H_AMT        = SOURCE.GL_TRANSACTION_H_AMT,
        DEBIT_CREDIT_FLG            = SOURCE.DEBIT_CREDIT_FLG,
        LOB_SK                      = SOURCE.LOB_SK,
        GEO_SK                      = SOURCE.GEO_SK,
        RECURRING_ENTRY_DOC_DT      = SOURCE.RECURRING_ENTRY_DOC_DT,
        POSTING_DT                  = SOURCE.POSTING_DT,
        DOCUMENT_TYPE_CD            = SOURCE.DOCUMENT_TYPE_CD,
        DOCUMENT_TYPE_DSC           = SOURCE.DOCUMENT_TYPE_DSC,
        EMPLOYEE_SK                 = SOURCE.EMPLOYEE_SK,
        USD_GROSS_AMT               = SOURCE.USD_GROSS_AMT,
        USD_NET_AMT                 = SOURCE.USD_NET_AMT,
        BUSINESS_SEGMENT_NM         = SOURCE.BUSINESS_SEGMENT_NM,
        CREATE_TS                   = SOURCE.CREATE_TS,
        LAST_UPDATE_TS              = SOURCE.LAST_UPDATE_TS,
        SYS_EFF_TS                  = SOURCE.SYS_EFF_TS,
        SYS_EXP_TS                  = SOURCE.SYS_EXP_TS,
        INGEST_TS                   = SOURCE.INGEST_TS,
        DL_LAST_UPDATE_TS           = SOURCE.DL_LAST_UPDATE_TS,
        CHKSUM_STR                  = SOURCE.CHKSUM_STR,
        LOAD_TS                     = SOURCE.LOAD_TS,
        DML_ACTION_TYPE_CD          = 'U',
        DBT_SCD_ID                  = SOURCE.DBT_SCD_ID,
        CURR_FLG                    = SOURCE.CURR_FLG,
        SOURCE_SYSTEM_NM            = SOURCE.SOURCE_SYSTEM_NM,
        INSTANCE_NM                 = SOURCE.INSTANCE_NM,
        ROOT_EXECN_PID              = SOURCE.ROOT_EXECN_PID,
        ADF_PIPELINE_NM             = SOURCE.ADF_PIPELINE_NM,
        ADF_TRANSFORMATION_NM       = SOURCE.ADF_TRANSFORMATION_NM,
        ADF_SCRIPT_NM               = SOURCE.ADF_SCRIPT_NM
      WHEN MATCHED AND SOURCE.CURR_FLG = 'N' THEN
      UPDATE SET
        DML_ACTION_TYPE_CD = 'D',
        SYS_EXP_TS = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
        CURR_FLG = 'N'
