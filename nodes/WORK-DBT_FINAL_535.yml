        SHIP_TO_ACC_ID, BILL_TO_ACC_ID, CUST_STATUS_CD, CONTRACT_SK, LEDGER_DSC, ACCOUNTING_DOC_LINE_ID, ACCOUNTING_DOC_ID,
        TRANSACTION_REFERENCE_ID, ENTITY_CD, LEDGER_CURRENCY_CD, CONTRACT_NBR_ID, ENTITY_SK, GL_ACCOUNT_CD, GL_TRANSACTION_H_AMT,
        DEBIT_CREDIT_FLG, LOB_SK, GEO_SK, RECURRING_ENTRY_DOC_DT, POSTING_DT, DOCUMENT_TYPE_CD, DOCUMENT_TYPE_DSC, EMPLOYEE_SK,
        USD_GROSS_AMT, USD_NET_AMT, BUSINESS_SEGMENT_NM, CREATE_TS, LAST_UPDATE_TS, SYS_EFF_TS, SYS_EXP_TS, INGEST_TS,
        DL_LAST_UPDATE_TS, CHKSUM_STR, LOAD_TS, DML_ACTION_TYPE_CD, DBT_SCD_ID, CURR_FLG, SOURCE_SYSTEM_NM, INSTANCE_NM,
        ROOT_EXECN_PID, ADF_PIPELINE_NM, ADF_TRANSFORMATION_NM, ADF_SCRIPT_NM
      )
      VALUES (
        TARGET.SCHEMA_003.GL_DISTIBUTION_FACT_SEQ.NEXTVAL,
        SOURCE.GL_DISTR_INTG_ID, SOURCE.CURRENCY_SK, SOURCE.SOURCE_SYSTEM_SK, SOURCE.INVOICE_NO, SOURCE.CUSTOMER_NBR,
        SOURCE.GL_ACCOUNT_SK, SOURCE.BRANCH_CD, SOURCE.GL_TRANSACTION_AMT, SOURCE.GL_TRANSACTION_DT, SOURCE.ACC_PERIOD_YEAR,
        SOURCE.GL_PERIOD_NBR, SOURCE.GL_PERIOD_YR, SOURCE.FISCAL_YEAR_NBR, SOURCE.COST_CENTER_ID, SOURCE.CURRENCY_CD,
        SOURCE.TRANSACTION_TYPE_DSC, SOURCE.LINE_DSC, SOURCE.ACCOUNTED_CREDIT_AMT, SOURCE.ACCOUNTED_DEBIT_AMT, SOURCE.LINE_CREDIT_AMT,
        SOURCE.LINE_STATUS_CD, SOURCE.SHIP_TO_ACC_ID, SOURCE.BILL_TO_ACC_ID, SOURCE.CUST_STATUS_CD, SOURCE.CONTRACT_SK,
        SOURCE.LEDGER_DSC, SOURCE.ACCOUNTING_DOC_LINE_ID, SOURCE.ACCOUNTING_DOC_ID, SOURCE.TRANSACTION_REFERENCE_ID, SOURCE.ENTITY_CD,
        SOURCE.LEDGER_CURRENCY_CD, SOURCE.CONTRACT_NBR_ID, SOURCE.ENTITY_SK, SOURCE.GL_ACCOUNT_CD, SOURCE.GL_TRANSACTION_H_AMT,
        SOURCE.DEBIT_CREDIT_FLG, SOURCE.LOB_SK, SOURCE.GEO_SK, SOURCE.RECURRING_ENTRY_DOC_DT, SOURCE.POSTING_DT,
        SOURCE.DOCUMENT_TYPE_CD, SOURCE.DOCUMENT_TYPE_DSC, SOURCE.EMPLOYEE_SK, SOURCE.USD_GROSS_AMT, SOURCE.USD_NET_AMT,
        SOURCE.BUSINESS_SEGMENT_NM, SOURCE.CREATE_TS, SOURCE.LAST_UPDATE_TS, SOURCE.SYS_EFF_TS, SOURCE.SYS_EXP_TS, SOURCE.INGEST_TS,
        SOURCE.DL_LAST_UPDATE_TS, SOURCE.CHKSUM_STR, SOURCE.LOAD_TS, 'I', SOURCE.DBT_SCD_ID, SOURCE.CURR_FLG, SOURCE.SOURCE_SYSTEM_NM,
        SOURCE.INSTANCE_NM, SOURCE.ROOT_EXECN_PID, SOURCE.ADF_PIPELINE_NM, SOURCE.ADF_TRANSFORMATION_NM, SOURCE.ADF_SCRIPT_NM
      );
