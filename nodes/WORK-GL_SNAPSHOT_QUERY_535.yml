        dependencies:
          - locationName: SRC
            nodeName: SOURCE_SYSTEM_DIM
          - locationName: SRC
            nodeName: TTFGLD009535
          - locationName: WORK
            nodeName: GL_TFGLD008535
        join:
          joinCondition: |-
            FROM {{ ref('WORK', 'GL_TFGLD008535') }} TFGLD008

            LEFT OUTER JOIN (
              SELECT DISTINCT
                LISTAGG(CONCAT_WS('-', TRIM(T_FDIM), TRIM(T_UDIM)), ',') AS COST_CENTER_CD,
                T_LEAC
              FROM {{ ref('SRC', 'TTFGLD009535') }}
              WHERE TRIM(T_DTYP) = '1.0000000000'
              GROUP BY T_LEAC
            ) TFGLD009
            ON TRIM(TFGLD008.T_LEAC) = TRIM(TFGLD009.T_LEAC)

            LEFT OUTER JOIN {{ ref('SRC', 'SOURCE_SYSTEM_DIM') }} SD
            ON SD.SOURCE_SYSTEM_CD = 'SOURCE_SYSTEM_003'
            AND SD.SITE_REGION_CD = 'INSTANCE_004'
            AND SD.CURR_FLG = 'Y'
            AND TRIM(SD.SOURCE_COMPANY_CD) = TRIM(TFGLD008.COUNTRY_CD)

            QUALIFY ROW_NUMBER() OVER (
              PARTITION BY CONCAT_WS('~', COALESCE(TRIM(TFGLD008.T_LEAC), ''), '535', 'INSTANCE_004', 'SOURCE_SYSTEM_003')
              ORDER BY TFGLD008.T_LEAC
            ) = 1
