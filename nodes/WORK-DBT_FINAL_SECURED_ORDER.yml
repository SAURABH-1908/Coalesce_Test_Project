name: DBT_FINAL_SECURED_ORDER
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'SECURED_ORDER_FACT') }} AS DBT_INTERNAL_DEST

      USING {{ ref('WORK', 'DBT_FINAL_SECURED_ORDER') }} AS DBT_INTERNAL_SOURCE

      ON TO_VARCHAR(DBT_INTERNAL_SOURCE.SECURE_ORDER_INTG_ID)
         = TO_VARCHAR(DBT_INTERNAL_DEST.SECURE_ORDER_INTG_ID)
      AND DBT_INTERNAL_SOURCE.SYS_EFF_TS = DBT_INTERNAL_DEST.SYS_EFF_TS

      WHEN MATCHED
      AND DBT_INTERNAL_DEST.SYS_EXP_TS IS NULL
      AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD IN ('D','U')

      THEN UPDATE SET

          SYS_EXP_TS         = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
          CURR_FLG           = DBT_INTERNAL_SOURCE.CURR_FLG,
          DML_ACTION_TYPE_CD = DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD

      WHEN NOT MATCHED
      AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD = 'I'

      THEN INSERT
      (
          SECURE_ORDER_INTG_ID,
          SOURCE_SECURED_ORDER_NBR,
          SECURED_ORDER_NBR,
          SECURED_ORDER_DSC,
          SOURCE_SECURED_ORDER_STATUS_CD,
          CHANGE_ORDER_NBR,
          ORDER_ORDERED_DATE_SK,
          ORDER_PLACED_DATE_SK,
          ORDER_REVISION_NBR,
