          ORDER_LINE_STATUS_CD,
          PRODUCT_CD,
          ORDER_LINE_ORDERED_QTY,
          ORDER_LINE_QUANTITY_UOM,
          ORDER_LINE_CANCELLED_QTY,
          UNIT_SELLING_PRICE_AMT,
          LINE_ITEM_DESCRIPTION_TXT,
          ACTUAL_SHIPMENT_DATE_SK,
          SCHEDULED_DELIVERY_DATE_SK,
          CONTRACT_BOOKED_DATE_SK,
          CONTRACT_SECURED_PRICE_AMT,
          CONTRACT_ORIG_ESTIMATED_PRICE_AMT,
          ESTIMATED_COST_AMT,
          ACTUAL_COST_AMT,
          ORDER_TYPE_NM,
          ORIGINAL_ORDER_BOOKED_DATE_SK,
          ORIGINAL_OL_PROMISE_DATE_SK,
          ORDER_LINE_FULFILLED_QTY,
          GEO_SK,
          ORDER_START_TS,
          ORDER_END_TS,
          REVENUE_AMT,
          LINE_OF_BUSINESS_CD,
          CURRENCY_CD,
          LEGAL_ENTITY_CD,
          LEGAL_ENTITY_NM,
          ERP_ENTITY_CD,
