          EST_SUBCONTRACT_COST_AMT,
          EST_OTHER_COST_AMT,
          LINE_OF_BUSINESS_SK,
          COST_CENTER_CD,
          ORDER_QTY_NBR,
          PAYMENT_TERM_CD,
          ITEM_NBR_SK,
          CUSTOMER_PO_NBR,
          CUSTOMER_PO_DT,
          CUSTOMER_SK,
          LOCAL_COORDINATOR_ID,
          LOCAL_COORDINATOR_NM,
          BUSINESS_SEGMENT_NM,
          SOURCE_SYSTEM_SK,
          CREATE_TS,
          LAST_UPDATE_TS,
