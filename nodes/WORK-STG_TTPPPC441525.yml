        join:
          joinCondition: |-
            FROM {{ ref('SRC', 'TTPPDM600525') }} T6

            LEFT OUTER JOIN {{ ref('SRC', 'TTPPPC441525') }} T441_MCA
            ON TRIM(T6.T_CPRJ) = TRIM(T441_MCA.T_CPRJ) AND TRIM(T441_MCA.T_CACT) = '000000'
            AND TRIM(T441_MCA.T_MPTO) = 2 AND TRIM(T441_MCA.T_COTP) = 2

            LEFT OUTER JOIN {{ ref('SRC', 'TTPPPC441525') }} T441_LCA
            ON TRIM(T6.T_CPRJ) = TRIM(T441_LCA.T_CPRJ) AND TRIM(T441_LCA.T_CACT) = '000000'
            AND TRIM(T441_LCA.T_MPTO) = 2 AND TRIM(T441_LCA.T_COTP) = 1

            LEFT OUTER JOIN {{ ref('SRC', 'TTPPPC441525') }} T441_SCA
            ON TRIM(T6.T_CPRJ) = TRIM(T441_SCA.T_CPRJ) AND TRIM(T441_SCA.T_CACT) = '000000'
            AND TRIM(T441_SCA.T_MPTO) = 2 AND TRIM(T441_SCA.T_COTP) = 4

            LEFT OUTER JOIN {{ ref('SRC', 'TTPPPC441525') }} T441_OCA
            ON TRIM(T6.T_CPRJ) = TRIM(T441_OCA.T_CPRJ) AND TRIM(T441_OCA.T_CACT) = '000000'
            AND TRIM(T441_OCA.T_MPTO) = 2 AND TRIM(T441_OCA.T_COTP) = 5

            GROUP BY 1
