    sourceMapping:
      - aliases:
          T100: 5b27c73b-0769-46b8-8265-857c20007df8
          T112: 9bc57b13-0ac9-4057-946c-a92627f9514d
          T64: c4ac9752-4715-4f74-9f93-32eab3ead7c1
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: CUSTOMER_DIM
          - locationName: SRC
            nodeName: SOURCE_SYSTEM_DIM
          - locationName: SRC
            nodeName: TTCCOM100525
          - locationName: SRC
            nodeName: TTCCOM112525
          - locationName: SRC
            nodeName: TTCMCS064525
        join:
          joinCondition: |-
            FROM {{ ref('SRC', 'TTCCOM100525') }} T100

            LEFT OUTER JOIN {{ ref('SRC', 'TTCCOM112525') }} T112
            ON TRIM(T100.T_BPID) = TRIM(T112.T_ITBP)

            LEFT OUTER JOIN {{ ref('SRC', 'TTCMCS064525') }} T64
            ON TRIM(T112.T_CRAT) = TRIM(T64.T_CRAT)

            LEFT OUTER JOIN {{ ref('SRC', 'SOURCE_SYSTEM_DIM') }} SD
            ON SD.SOURCE_COMPANY_CD = '525'
            AND SD.SOURCE_SYSTEM_CD = 'SOURCE_SYSTEM_002'
            AND SD.SITE_REGION_CD = 'INSTANCE_004'
            AND SD.CURR_FLG = 'Y'

            LEFT OUTER JOIN (
              SELECT CUSTOMER_SK, CUSTOMER_ID, COMPANY_CD
              FROM {{ ref('SRC', 'CUSTOMER_DIM') }}
              WHERE SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_001'
              AND INSTANCE_NM = 'INSTANCE_001'
              AND CURR_FLG = 'Y'
            ) CUD
            ON TRIM(T100.T_BPID) = CUD.CUSTOMER_ID
            AND CUD.COMPANY_CD = '525'

            QUALIFY ROW_NUMBER() OVER (
              PARTITION BY CONCAT_WS('~', TRIM(T100.T_BPID), '525', 'SOURCE_SYSTEM_003', 'INSTANCE_004')
              ORDER BY T112.T_CRLR DESC NULLS LAST
            ) = 1
        name: SNAPSHOT_QUERY
        noLinkRefs: []
