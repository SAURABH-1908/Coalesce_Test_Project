fileVersion: 1
id: 26373f6c-3f69-4c2e-8325-7043bae9bc5c
name: DBT_FINAL1
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'SECURED_ORDER_DIM') }} AS DBT_INTERNAL_DEST

      USING {{ ref('WORK', 'DBT_FINAL1') }} AS DBT_INTERNAL_SOURCE

      ON TO_VARCHAR(DBT_INTERNAL_SOURCE.TARGET_PRIMARY_KEY) = TO_VARCHAR(DBT_INTERNAL_DEST.SECURED_ORDER_INTG_ID)

      AND TO_NUMBER(DBT_INTERNAL_SOURCE.SECURED_ORDER_SK) = DBT_INTERNAL_DEST.SECURED_ORDER_SK

      AND DBT_INTERNAL_SOURCE.SYS_EFF_TS = DBT_INTERNAL_DEST.SYS_EFF_TS

      WHEN MATCHED
          AND DBT_INTERNAL_DEST.SYS_EXP_TS IS NULL
          AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD IN ('D','U')

      THEN UPDATE SET

          SYS_EXP_TS = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),

          CURR_FLG = DBT_INTERNAL_SOURCE.CURR_FLG,

          DML_ACTION_TYPE_CD = DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD

      WHEN NOT MATCHED
          AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD = 'I'

      THEN INSERT (

          SECURED_ORDER_SK,
          SECURED_ORDER_INTG_ID,
          ORDER_NBR_ID,
          ORDER_START_DT,
          ORDER_END_DT,
          ORDER_CLOSED_DT,
          ORDER_STATUS_CD,
          ORDER_STATUS_DSC,
          CURRENCY_CD,
          LOCAL_CURRENCY_CD,
          ENTITY_CD,
          ORDER_CREATION_DT,
          SALES_REP_NM,
          ORDER_TERM_CD,
          CUSTOMER_NBR,
          ORDER_TERM_DSC,
          PAYMENT_METHOD_CD,
          PAYMENT_METHOD_DSC,
          MARKET_CHANNEL_DSC,
          RELEASE_DT,
          BOOKING_PERSON_NM,
          BUSINESSUNIT_NM,
          BUSINESS_SEGMENT_NM,
          SOURCE_SYSTEM_SK,
          CREATE_TS,
          LAST_UPDATE_TS,
          SYS_EFF_TS,
          SYS_EXP_TS,
          INGEST_TS,
          DL_LAST_UPDATE_TS,
          CHKSUM_STR,
          LOAD_TS,
          DML_ACTION_TYPE_CD,
          DBT_SCD_ID,
          CURR_FLG,
          SOURCE_SYSTEM_NM,
          INSTANCE_NM,
          ROOT_EXECN_PID,
          ADF_PIPELINE_NM,
          ADF_TRANSFORMATION_NM,
          ADF_SCRIPT_NM

      )

      VALUES (

          TO_NUMBER(DBT_INTERNAL_SOURCE.SECURED_ORDER_SK),
          DBT_INTERNAL_SOURCE.SECURED_ORDER_INTG_ID,
          DBT_INTERNAL_SOURCE.ORDER_NBR_ID,
          DBT_INTERNAL_SOURCE.ORDER_START_DT,
          DBT_INTERNAL_SOURCE.ORDER_END_DT,
          DBT_INTERNAL_SOURCE.ORDER_CLOSED_DT,
          DBT_INTERNAL_SOURCE.ORDER_STATUS_CD,
          DBT_INTERNAL_SOURCE.ORDER_STATUS_DSC,
          DBT_INTERNAL_SOURCE.CURRENCY_CD,
          DBT_INTERNAL_SOURCE.LOCAL_CURRENCY_CD,
          DBT_INTERNAL_SOURCE.ENTITY_CD,
          DBT_INTERNAL_SOURCE.ORDER_CREATION_DT,
          DBT_INTERNAL_SOURCE.SALES_REP_NM,
          DBT_INTERNAL_SOURCE.ORDER_TERM_CD,
          DBT_INTERNAL_SOURCE.CUSTOMER_NBR,
          DBT_INTERNAL_SOURCE.ORDER_TERM_DSC,
          DBT_INTERNAL_SOURCE.PAYMENT_METHOD_CD,
          DBT_INTERNAL_SOURCE.PAYMENT_METHOD_DSC,
          DBT_INTERNAL_SOURCE.MARKET_CHANNEL_DSC,
          DBT_INTERNAL_SOURCE.RELEASE_DT,
          DBT_INTERNAL_SOURCE.BOOKING_PERSON_NM,
          DBT_INTERNAL_SOURCE.BUSINESSUNIT_NM,
          DBT_INTERNAL_SOURCE.BUSINESS_SEGMENT_NM,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_SK,
          DBT_INTERNAL_SOURCE.CREATE_TS,
          DBT_INTERNAL_SOURCE.LAST_UPDATE_TS,
          DBT_INTERNAL_SOURCE.SYS_EFF_TS,
          DBT_INTERNAL_SOURCE.SYS_EXP_TS,
          DBT_INTERNAL_SOURCE.INGEST_TS,
          DBT_INTERNAL_SOURCE.DL_LAST_UPDATE_TS,
          DBT_INTERNAL_SOURCE.CHKSUM_STR,
          DBT_INTERNAL_SOURCE.LOAD_TS,
          DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD,
          DBT_INTERNAL_SOURCE.DBT_SCD_ID,
          DBT_INTERNAL_SOURCE.CURR_FLG,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_NM,
          DBT_INTERNAL_SOURCE.INSTANCE_NM,
          DBT_INTERNAL_SOURCE.ROOT_EXECN_PID,
          DBT_INTERNAL_SOURCE.ADF_PIPELINE_NM,
          DBT_INTERNAL_SOURCE.ADF_TRANSFORMATION_NM,
          DBT_INTERNAL_SOURCE.ADF_SCRIPT_NM

      );
