            nodeName: TTCCOM130525
          - locationName: SRC
            nodeName: TTPPDM600525
          - locationName: WORK
            nodeName: CTA_TSICDB005525
        join:
          joinCondition: |-
            FROM {{ ref('SRC', 'TTPPDM600525') }} A

            JOIN {{ ref('SRC', 'TTCCOM130525') }} B
            ON TRIM(A.T_PADR) = TRIM(B.T_CADR)

            JOIN {{ ref('SRC', 'GBL_ADDRESS_DIM') }} C
            ON TRIM(A.T_PADR) = TRIM(C.SOURCE_ADDRESS_CD)

            JOIN {{ ref('WORK', 'CTA_TSICDB005525') }} E
            ON TRIM(A.T_CPRJ) = TRIM(E.T_PROJ)

            JOIN {{ ref('SRC', 'INST_CONTRACT_DIM') }} D
            ON CONCAT(TRIM(A.T_CPRJ), '-', COALESCE(TRIM(E.T_FAMI), '')) = D.CONTRACT_NBR

            WHERE C.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002'
            AND C.INSTANCE_NM = 'INSTANCE_004'
            AND C.CURR_FLG = 'Y'
