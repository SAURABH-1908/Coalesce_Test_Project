id: 7e526e0d-3d5d-448f-982b-d27567914294
name: DBT_FINAL
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'ACCOUNT_CREDIT_DIM') }} AS DBT_INTERNAL_DEST
      USING {{ ref('WORK', 'DBT_FINAL') }} AS DBT_INTERNAL_SOURCE
      ON TO_VARCHAR(DBT_INTERNAL_SOURCE.TARGET_PRIMARY_KEY) = TO_VARCHAR(DBT_INTERNAL_DEST.ACCOUNT_CREDIT_INTG_ID)
      AND TO_NUMBER(DBT_INTERNAL_SOURCE.ACCOUNT_CREDIT_SK) = TO_NUMBER(DBT_INTERNAL_DEST.ACCOUNT_CREDIT_SK)
      AND DBT_INTERNAL_SOURCE.SYS_EFF_TS = DBT_INTERNAL_DEST.SYS_EFF_TS

      WHEN MATCHED AND DBT_INTERNAL_DEST.SYS_EXP_TS IS NULL AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD IN ('D','U')
      THEN UPDATE SET
          SYS_EXP_TS = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
          CURR_FLG = DBT_INTERNAL_SOURCE.CURR_FLG,
          DML_ACTION_TYPE_CD = DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD

      WHEN NOT MATCHED AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD = 'I'
      THEN INSERT (
          ACCOUNT_CREDIT_SK,
          ACCOUNT_CREDIT_INTG_ID,
          SOURCE_SYSTEM_CD,
          SOURCE_SYSTEM_SK,
          ACCOUNT_CD,
          ACCOUNT_NM,
          GLOBAL_DUNS_NBR_TXT,
          CURRENCY_CD,
          CREDIT_LIMIT_LC_NBR,
          CREDIT_STATUS_CD,
          CUSTOMER_SK,
          CREATE_TS,
          LAST_UPDATE_TS,
          SYS_EFF_TS,
          SYS_EXP_TS,
          INGEST_TS,
          DL_LAST_UPDATE_TS,
          CHKSUM_STR,
          LOAD_TS,
          DML_ACTION_TYPE_CD,
          DBT_SCD_ID,
          CURR_FLG,
          SOURCE_SYSTEM_NM,
          INSTANCE_NM,
          ADF_PIPELINE_NM,
          ADF_TRANSFORMATION_NM,
          ADF_SCRIPT_NM,
          BUSINESS_SEGMENT_NM,
          ROOT_EXECN_PID
      )
      VALUES (
          TO_NUMBER(DBT_INTERNAL_SOURCE.ACCOUNT_CREDIT_SK),
          DBT_INTERNAL_SOURCE.ACCOUNT_CREDIT_INTG_ID,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_CD,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_SK,
          DBT_INTERNAL_SOURCE.ACCOUNT_CD,
          DBT_INTERNAL_SOURCE.ACCOUNT_NM,
          DBT_INTERNAL_SOURCE.GLOBAL_DUNS_NBR_TXT,
          DBT_INTERNAL_SOURCE.CURRENCY_CD,
          DBT_INTERNAL_SOURCE.CREDIT_LIMIT_LC_NBR,
          DBT_INTERNAL_SOURCE.CREDIT_STATUS_CD,
          DBT_INTERNAL_SOURCE.CUSTOMER_SK,
          DBT_INTERNAL_SOURCE.CREATE_TS,
          DBT_INTERNAL_SOURCE.LAST_UPDATE_TS,
          DBT_INTERNAL_SOURCE.SYS_EFF_TS,
          DBT_INTERNAL_SOURCE.SYS_EXP_TS,
          DBT_INTERNAL_SOURCE.INGEST_TS,
          DBT_INTERNAL_SOURCE.DL_LAST_UPDATE_TS,
          DBT_INTERNAL_SOURCE.CHKSUM_STR,
          DBT_INTERNAL_SOURCE.LOAD_TS,
          DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD,
          DBT_INTERNAL_SOURCE.DBT_SCD_ID,
          DBT_INTERNAL_SOURCE.CURR_FLG,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_NM,
          DBT_INTERNAL_SOURCE.INSTANCE_NM,
          '${adf_pipeline_nm}',
          '${adf_datafactory_nm}',
          'otc-finance/NA/BAAN_V_525/LOAD_FNL_BAAN_V_525_ACCOUNT_CREDIT_DIM.sql',
          'Americas',
          NULL
      );
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
  database: ""
  deployEnabled: true
  description: Final union of insertion, update and delete action rows for BAAN V_525 account credit, merged into ACCOUNT_CREDIT_DIM via post-SQL.
