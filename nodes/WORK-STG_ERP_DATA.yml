        join:
          joinCondition: |-
            FROM {{ ref('SRC', 'TTFGLD106535') }} TFGLD106

                LEFT JOIN {{ ref('TARGET', 'SOURCE_SYSTEM_DIM') }} SRC_SYS_DIM
                  ON TRIM(SRC_SYS_DIM.SOURCE_COMPANY_CD) = '535'
                  AND TRIM(SRC_SYS_DIM.SOURCE_SYSTEM_CD) = 'SOURCE_SYSTEM_002'
                  AND TRIM(SRC_SYS_DIM.SITE_REGION_CD) = 'INSTANCE_004'
                  AND TRIM(SRC_SYS_DIM.CURR_FLG) = 'Y'

                LEFT JOIN {{ ref('TARGET', 'DATE_DIM') }} DATE_DIM
                  ON TFGLD106.T_DCDT = TO_DATE(DATE_DIM.DATE_SK, 'YYYYMMDD')

                LEFT JOIN {{ ref('SRC', 'TTFGLD011535') }} TFGLD011
                  ON TRIM(TFGLD106.T_OTYP) = TRIM(TFGLD011.T_TTYP)

                LEFT JOIN {{ ref('SRC', 'TTFGLD100535') }} TFGLD100
                  ON TRIM(TFGLD106.T_OYER) = TRIM(TFGLD100.T_YEAR)
                  AND TRIM(TFGLD106.T_OBAT) = TRIM(TFGLD100.T_BTNO)

                LEFT JOIN {{ ref('SRC', 'TCISLI205535') }} CISLI205
                  ON TRIM(TFGLD106.T_OTYP) = TRIM(CISLI205.T_ITYP)
                  AND FLOOR(TRIM(TFGLD106.T_ODOC)) = FLOOR(TRIM(CISLI205.T_IDOC))
                  AND FLOOR(TRIM(TFGLD106.T_OCMP)) = FLOOR(TRIM(CISLI205.T_SFCP))

                LEFT JOIN {{ ref('SRC', 'TTCCOM100535') }} TCCOM100
                  ON TRIM(TFGLD106.T_BPID) = TRIM(TCCOM100.T_BPID)

                LEFT JOIN {{ ref('SRC', 'TTFGLD008535') }} TFGLD008
                  ON TRIM(TFGLD106.T_LEAC) = TRIM(TFGLD008.T_LEAC)

                LEFT OUTER JOIN {{ ref('TARGET', 'GL_ACCOUNT_DIM') }} C
                  ON TRIM(TFGLD106.T_LEAC) = TRIM(C.SRC_ACCOUNT_CD)
                  AND C.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002'
                  AND C.INSTANCE_NM = 'INSTANCE_004'
                  AND C.CURR_FLG = 'Y'
                  AND C.ERP_ENTITY_CD = '535'

                LEFT JOIN (
                  SELECT DISTINCT T_ITYP, T_IDOC, T_SFCP, T_CPRJ
                  FROM {{ ref('SRC', 'TCISLI235535') }}
                ) CISLI235
                  ON TRIM(TFGLD106.T_OTYP) = TRIM(CISLI235.T_ITYP)
                  AND FLOOR(TRIM(TFGLD106.T_ODOC)) = FLOOR(TRIM(CISLI235.T_IDOC))
                  AND FLOOR(TRIM(TFGLD106.T_OCMP)) = FLOOR(TRIM(CISLI235.T_SFCP))

                LEFT JOIN {{ ref('SRC', 'TTPPDM600535') }} TPPDM600
                  ON TRIM(CISLI235.T_CPRJ) = TRIM(TPPDM600.T_CPRJ)

                LEFT OUTER JOIN {{ ref('TARGET', 'CURRENCY_DIM') }} CUR
                  ON TFGLD106.T_CCUR = CUR.SOURCE_CURRENCY_CD
                  AND CUR.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_005'
                  AND CUR.INSTANCE_NM = 'INSTANCE_002'
                  AND CUR.CURR_FLG = 'Y'

                LEFT JOIN (
                  SELECT CONTRACT_NBR, CONTRACT_SK
                  FROM (
                    SELECT TRIM(SPLIT_PART(ICD.CONTRACT_NBR, '-', 1)) AS CONTRACT_NBR, ICD.CONTRACT_SK
                    FROM {{ ref('TARGET', 'INST_CONTRACT_DIM') }} ICD
                    WHERE TRIM(SPLIT_PART(ICD.CONTRACT_NBR, '-', 1)) IN (SELECT DISTINCT TRIM(T_CPRJ) FROM {{ ref('SRC', 'TTPPDM600535') }})
                      AND TRIM(ICD.SOURCE_SYSTEM_NM) = 'SOURCE_SYSTEM_002'
                      AND TRIM(ICD.INSTANCE_NM) = 'INSTANCE_004'
                      AND TRIM(ICD.CURR_FLG) = 'Y'
                      AND ICD.COUNTRY_CD = 'CA'
                  )
                ) INST_CONTRACT_DIM
                  ON TRIM(INST_CONTRACT_DIM.CONTRACT_NBR) = TRIM(TPPDM600.T_CPRJ)

                LEFT JOIN {{ ref('TARGET', 'ENTITY_DIM') }} ENTITY_DIM
                  ON CAST(TRIM(TFGLD106.T_OCMP) AS INT) = FLOOR(TRIM(ENTITY_DIM.ENTITY_CD))
                  AND TRIM(ENTITY_DIM.SOURCE_SYSTEM_NM) = 'SOURCE_SYSTEM_002'
                  AND TRIM(ENTITY_DIM.INSTANCE_NM) = 'INSTANCE_004'
                  AND TRIM(ENTITY_DIM.CURR_FLG) = 'Y'

                LEFT JOIN {{ ref('TARGET', 'LINE_OF_BUSINESS_DIM') }} LOB_DIM
                  ON CAST(TRIM(TFGLD106.T_OCMP) AS INT) = FLOOR(TRIM(LOB_DIM.ERP_ENTITY_CD))
                  AND LOB_DIM.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002'
                  AND LOB_DIM.INSTANCE_NM = 'INSTANCE_004'
                  AND LOB_DIM.CURR_FLG = 'Y'
                  AND LOB_DIM.ERP_ENTITY_CD = '535'

                LEFT JOIN (
                  SELECT BRANCH_CD, GEO_SK
                  FROM {{ ref('TARGET', 'GEOGRAPHY_DIM') }}
                  WHERE SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002'
                    AND INSTANCE_NM = 'INSTANCE_004'
                    AND CURR_FLG = 'Y'
                    AND BRANCH_CD IN (SELECT DISTINCT TRIM(T_PADR) FROM {{ ref('SRC', 'TTPPDM600535') }})
                    AND COMPANY_CD = '535'
                ) GEO_DIM
                  ON CAST(TRIM(TPPDM600.T_PADR) AS VARCHAR(30)) = CAST(TRIM(GEO_DIM.BRANCH_CD) AS VARCHAR(30))
