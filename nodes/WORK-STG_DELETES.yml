operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      UPDATE {{ ref('TARGET', 'REVENUE_CONTRACT_FACT') }} AS TARGET
      SET DML_ACTION_TYPE_CD = 'D',
          SYS_EXP_TS = to_timestamp_ntz(convert_timezone('UTC', current_timestamp())),
          CURR_FLG = 'N'
      FROM {{ ref('WORK', 'STG_DELETES') }} AS SOURCE
      WHERE TO_VARCHAR(TARGET.REVENUE_CONTRACT_INTG_ID) = TO_VARCHAR(SOURCE.REVENUE_CONTRACT_INTG_ID)
        AND TARGET.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_003'
        AND TARGET.INSTANCE_NM = 'INSTANCE_004'
        AND SOURCE.CURR_FLG = 'N';
