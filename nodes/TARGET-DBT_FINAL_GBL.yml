fileVersion: 1
id: f1d768be-02cc-4f17-91e2-bcb2db59636a
name: DBT_FINAL_GBL
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'GBL_ADDRESS_DIM') }} AS DBT_INTERNAL_DEST
      USING {{ ref('TARGET', 'DBT_FINAL_GBL') }} AS DBT_INTERNAL_SOURCE
      ON TO_VARCHAR(DBT_INTERNAL_SOURCE.TARGET_PRIMARY_KEY) = TO_VARCHAR(DBT_INTERNAL_DEST.GBL_ADDRESS_INTG_ID)
      AND TO_VARCHAR(TO_NUMBER(DBT_INTERNAL_SOURCE.ADDRESS_SK)) = TO_VARCHAR(DBT_INTERNAL_DEST.DIM_NODE_KEY)
      AND DBT_INTERNAL_SOURCE.SYS_EFF_TS = DBT_INTERNAL_DEST.SYSTEM_START_DATE
      WHEN MATCHED AND DBT_INTERNAL_DEST.SYSTEM_END_DATE IS NULL AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD IN ('D','U')
      THEN UPDATE SET
          DBT_INTERNAL_DEST.SYSTEM_END_DATE = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
          DBT_INTERNAL_DEST.SYSTEM_CURRENT_FLAG = DBT_INTERNAL_SOURCE.CURR_FLG
      WHEN NOT MATCHED AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD = 'I'
      THEN INSERT (
          DIM_NODE_KEY,
          GBL_ADDRESS_INTG_ID,
          SOURCE_ADDRESS_CD,
          ADDRESS_LINE_1,
          ADDRESS_LINE_2,
          ADDRESS_LINE_3,
          ADDRESS_AREA_CD,
          ADDRESS_AREA_NM,
          ADDRESS_DISTRICT_CD,
          ADDRESS_DISTRICT_NM,
          ADDRESS_CITY_CD,
          ADDRESS_CITY_NM,
          ADDRESS_STATE_CD,
          ADDRESS_STATE_NM,
          ADDRESS_COUNTRY_CD,
          ADDRESS_COUNTRY_NM,
          ADDRESS_REGION_CD,
          ADDRESS_REGION_NM,
          ADDRESS_POSTAL_CD,
          ERP_ENTITY_CD,
          ADDRESS_TYPE_FLG,
          ACCOUNT_CD,
          REFERENCE_CD,
          REFERENCE_TYPE_NM,
          BUSINESS_SEGMENT_NM,
          SOURCE_SYSTEM_SK,
          SYSTEM_START_DATE,
          SYSTEM_END_DATE,
          SYSTEM_CURRENT_FLAG,
          INGEST_TS,
          CHKSUM_STR,
          SOURCE_SYSTEM_NM,
          INSTANCE_NM,
          ADF_PIPELINE_NM,
          ADF_TRANSFORMATION_NM,
          ADF_SCRIPT_NM
      )
      VALUES (
          TO_NUMBER(DBT_INTERNAL_SOURCE.ADDRESS_SK),
          DBT_INTERNAL_SOURCE.GBL_ADDRESS_INTG_ID,
          DBT_INTERNAL_SOURCE.SOURCE_ADDRESS_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_LINE_1,
          DBT_INTERNAL_SOURCE.ADDRESS_LINE_2,
          DBT_INTERNAL_SOURCE.ADDRESS_LINE_3,
          DBT_INTERNAL_SOURCE.ADDRESS_AREA_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_AREA_NM,
          DBT_INTERNAL_SOURCE.ADDRESS_DISTRICT_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_DISTRICT_NM,
          DBT_INTERNAL_SOURCE.ADDRESS_CITY_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_CITY_NM,
          DBT_INTERNAL_SOURCE.ADDRESS_STATE_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_STATE_NM,
          DBT_INTERNAL_SOURCE.ADDRESS_COUNTRY_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_COUNTRY_NM,
          DBT_INTERNAL_SOURCE.ADDRESS_REGION_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_REGION_NM,
          DBT_INTERNAL_SOURCE.ADDRESS_POSTAL_CD,
          DBT_INTERNAL_SOURCE.ERP_ENTITY_CD,
          DBT_INTERNAL_SOURCE.ADDRESS_TYPE_FLG,
          DBT_INTERNAL_SOURCE.ACCOUNT_CD,
          DBT_INTERNAL_SOURCE.REFERENCE_CD,
          DBT_INTERNAL_SOURCE.REFERENCE_TYPE_NM,
          DBT_INTERNAL_SOURCE.BUSINESS_SEGMENT_NM,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_SK,
          DBT_INTERNAL_SOURCE.SYS_EFF_TS,
          DBT_INTERNAL_SOURCE.SYS_EXP_TS,
          DBT_INTERNAL_SOURCE.CURR_FLG,
          DBT_INTERNAL_SOURCE.INGEST_TS,
          DBT_INTERNAL_SOURCE.CHKSUM_STR,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_NM,
          DBT_INTERNAL_SOURCE.INSTANCE_NM,
          DBT_INTERNAL_SOURCE.ADF_PIPELINE_NM,
          DBT_INTERNAL_SOURCE.ADF_TRANSFORMATION_NM,
          DBT_INTERNAL_SOURCE.ADF_SCRIPT_NM
      );
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
