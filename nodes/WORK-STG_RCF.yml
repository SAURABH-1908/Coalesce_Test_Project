            FROM {{ ref('SRC', 'TTPPDM600525') }} T600

                LEFT OUTER JOIN {{ ref('SRC', 'TTPPDM065525') }} T65
                ON CAST(NULL AS VARCHAR) = TRIM(T65.T_CCOT)

                LEFT OUTER JOIN {{ ref('SRC', 'TSICDB002525') }} TS2
                ON TRIM(T600.T_CPRJ) = TRIM(TS2.T_PROJ)

                LEFT OUTER JOIN {{ ref('SRC', 'TTCMCS052525') }} T52
