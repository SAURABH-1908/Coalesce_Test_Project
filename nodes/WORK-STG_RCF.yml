                LEFT OUTER JOIN {{ ref('SRC', 'TTPPDM740525') }} T740
                ON TRIM(T600.T_CPRJ) = TRIM(T740.T_CPRJ)

                LEFT OUTER JOIN {{ ref('WORK', 'STG_TTPPPC441525') }} T441
                ON TRIM(T600.T_CPRJ) = TRIM(T441.PROJ_ID)

                LEFT OUTER JOIN {{ ref('WORK', 'STG_TCISLI235525') }} T235
                ON TRIM(T600.T_CPRJ) = TRIM(T235.PROJ_ID)

                LEFT OUTER JOIN {{ ref('WORK', 'STG_TSICDB005525') }} TS5
                ON TRIM(T600.T_CPRJ) = TRIM(TS5.PROJ_ID)

                LEFT OUTER JOIN (
                    SELECT DISTINCT T_SAL2, T_SAN2, T_CPRJ
                    FROM {{ ref('SRC', 'TSICDB401525') }}
                ) T401
                ON TRIM(T600.T_CPRJ) = TRIM(T401.T_CPRJ)

                LEFT OUTER JOIN {{ ref('SRC', 'TTCCOM001525') }} T001
                ON TRIM(TS2.T_SALR) = TRIM(T001.T_EMNO)

                LEFT OUTER JOIN {{ ref('TARGET', 'LINE_OF_BUSINESS_DIM') }} LOB
                ON TRIM(FLOOR(T600.T_NCMP)) = LOB.ERP_ENTITY_CD
                AND LOB.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002' AND LOB.INSTANCE_NM = 'INSTANCE_004'
                AND LOB.CURR_FLG = 'Y'

                LEFT OUTER JOIN (
                    SELECT * FROM {{ ref('TARGET', 'INST_CONTRACT_DIM') }}
                    WHERE SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_001' AND INSTANCE_NM = 'INSTANCE_001'
                    AND CURR_FLG = 'Y' AND INTERCOMPANY_CD = '525'
                ) CD
                ON CONCAT_WS('-', TRIM(T600.T_CPRJ), NVL(TRIM(TS5.T_FAMI), '')) = TRIM(CD.CONTRACT_NBR)

                LEFT OUTER JOIN {{ ref('TARGET', 'GEOGRAPHY_DIM') }} GD
                ON CAST(NULL AS VARCHAR) = GD.BRANCH_CD
                AND GD.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002' AND GD.INSTANCE_NM = 'INSTANCE_004'
                AND GD.CURR_FLG = 'Y' AND GD.COMPANY_CD = '525'

                LEFT OUTER JOIN {{ ref('TARGET', 'ENTITY_DIM') }} ED
                ON TRIM(T600.T_NCMP) = ED.ENTITY_CD
                AND ED.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002' AND ED.INSTANCE_NM = 'INSTANCE_004'
                AND ED.CURR_FLG = 'Y'

                LEFT OUTER JOIN {{ ref('TARGET', 'SOURCE_SYSTEM_DIM') }} SD
                ON '525' = SD.SOURCE_COMPANY_CD
                AND SD.SOURCE_SYSTEM_CD = 'SOURCE_SYSTEM_002' AND SD.SITE_REGION_CD = 'INSTANCE_004'
                AND SD.CURR_FLG = 'Y'

                LEFT OUTER JOIN {{ ref('TARGET', 'CUSTOMER_DIM') }} CUD
                ON TRIM(T740.T_OFBP) = CUD.CUSTOMER_NUMBER
                AND CUD.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_001' AND CUD.INSTANCE_NM = 'INSTANCE_001'
                AND CUD.CURR_FLG = 'Y' AND CUD.COMPANY_CD = '525'

                LEFT OUTER JOIN {{ ref('TARGET', 'CURRENCY_DIM') }} C_DIM
                ON TRIM(T600.T_CCUR) = C_DIM.SOURCE_CURRENCY_CD
                AND C_DIM.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_005' AND C_DIM.INSTANCE_NM = 'INSTANCE_002' AND C_DIM.CURR_FLG = 'Y'

                LEFT OUTER JOIN {{ ref('TARGET', 'EMPLOYEE_DIM') }} EMP_DIM
                ON TRIM(TS2.T_SALR) = EMP_DIM.EMPLOYEE_ID
                AND EMP_DIM.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_002' AND EMP_DIM.INSTANCE_NM = 'INSTANCE_004'
                AND EMP_DIM.CURR_FLG = 'Y'
