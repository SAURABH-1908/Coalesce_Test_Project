          SOURCE.TRANSACTION_REFERENCE_ID, SOURCE.ENTITY_CD, SOURCE.LEDGER_CURRENCY_CD,
          SOURCE.CONTRACT_NBR_ID, SOURCE.ENTITY_SK, SOURCE.GL_ACCOUNT_CD, SOURCE.GL_TRANSACTION_H_AMT,
          SOURCE.DEBIT_CREDIT_FLG, SOURCE.LOB_SK, SOURCE.GEO_SK, SOURCE.RECURRING_ENTRY_DOC_DT,
          SOURCE.POSTING_DT, SOURCE.DOCUMENT_TYPE_CD, SOURCE.DOCUMENT_TYPE_DSC, SOURCE.EMPLOYEE_SK,
