  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'GL_DISTIBUTION_FACT') }} AS DBT_INTERNAL_DEST
      USING (
          SELECT * FROM {{ ref('WORK', 'SNAPSHOT') }}
          UNION ALL
          SELECT * FROM {{ ref('WORK', 'DISTRIBUTION_DELETES') }}
      ) AS SOURCE
      ON  TO_VARCHAR(DBT_INTERNAL_DEST.GL_DISTR_INTG_ID) = TO_VARCHAR(SOURCE.GL_DISTR_INTG_ID)
      AND DBT_INTERNAL_DEST.SOURCE_SYSTEM_NM = 'SOURCE_SYSTEM_003'
      AND DBT_INTERNAL_DEST.INSTANCE_NM      = 'INSTANCE_004'

      WHEN MATCHED AND SOURCE.CURR_FLG = 'Y'
                    AND DBT_INTERNAL_DEST.CHKSUM_STR != SOURCE.CHKSUM_STR THEN
      UPDATE SET
          GL_DISTR_INTG_ID         = SOURCE.GL_DISTR_INTG_ID,
          CURRENCY_SK              = SOURCE.CURRENCY_SK,
          SOURCE_SYSTEM_SK         = SOURCE.SOURCE_SYSTEM_SK,
          INVOICE_NO               = SOURCE.INVOICE_NO,
          CUSTOMER_NBR             = SOURCE.CUSTOMER_NBR,
          GL_ACCOUNT_SK            = SOURCE.GL_ACCOUNT_SK,
          BRANCH_CD                = SOURCE.BRANCH_CD,
          GL_TRANSACTION_AMT       = SOURCE.GL_TRANSACTION_AMT,
          GL_TRANSACTION_DT        = SOURCE.GL_TRANSACTION_DT,
          ACC_PERIOD_YEAR          = SOURCE.ACC_PERIOD_YEAR,
          GL_PERIOD_NBR            = SOURCE.GL_PERIOD_NBR,
          GL_PERIOD_YR             = SOURCE.GL_PERIOD_YR,
          FISCAL_YEAR_NBR          = SOURCE.FISCAL_YEAR_NBR,
          COST_CENTER_ID           = SOURCE.COST_CENTER_ID,
          CURRENCY_CD              = SOURCE.CURRENCY_CD,
          TRANSACTION_TYPE_DSC     = SOURCE.TRANSACTION_TYPE_DSC,
          LINE_DSC                 = SOURCE.LINE_DSC,
          ACCOUNTED_CREDIT_AMT     = SOURCE.ACCOUNTED_CREDIT_AMT,
          ACCOUNTED_DEBIT_AMT      = SOURCE.ACCOUNTED_DEBIT_AMT,
          LINE_CREDIT_AMT          = SOURCE.LINE_CREDIT_AMT,
          LINE_STATUS_CD           = SOURCE.LINE_STATUS_CD,
          SHIP_TO_ACC_ID           = SOURCE.SHIP_TO_ACC_ID,
          BILL_TO_ACC_ID           = SOURCE.BILL_TO_ACC_ID,
          CUST_STATUS_CD           = SOURCE.CUST_STATUS_CD,
          CONTRACT_SK              = SOURCE.CONTRACT_SK,
          LEDGER_DSC               = SOURCE.LEDGER_DSC,
          ACCOUNTING_DOC_LINE_ID   = SOURCE.ACCOUNTING_DOC_LINE_ID,
