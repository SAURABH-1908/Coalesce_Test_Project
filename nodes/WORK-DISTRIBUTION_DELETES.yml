          ENTITY_CD                = SOURCE.ENTITY_CD,
          LEDGER_CURRENCY_CD       = SOURCE.LEDGER_CURRENCY_CD,
          CONTRACT_NBR_ID          = SOURCE.CONTRACT_NBR_ID,
          ENTITY_SK                = SOURCE.ENTITY_SK,
          GL_ACCOUNT_CD            = SOURCE.GL_ACCOUNT_CD,
          GL_TRANSACTION_H_AMT     = SOURCE.GL_TRANSACTION_H_AMT,
          DEBIT_CREDIT_FLG         = SOURCE.DEBIT_CREDIT_FLG,
          LOB_SK                   = SOURCE.LOB_SK,
          GEO_SK                   = SOURCE.GEO_SK,
          RECURRING_ENTRY_DOC_DT   = SOURCE.RECURRING_ENTRY_DOC_DT,
          POSTING_DT               = SOURCE.POSTING_DT,
          DOCUMENT_TYPE_CD         = SOURCE.DOCUMENT_TYPE_CD,
          DOCUMENT_TYPE_DSC        = SOURCE.DOCUMENT_TYPE_DSC,
          EMPLOYEE_SK              = SOURCE.EMPLOYEE_SK,
          USD_GROSS_AMT            = SOURCE.USD_GROSS_AMT,
          USD_NET_AMT              = SOURCE.USD_NET_AMT,
          BUSINESS_SEGMENT_NM      = SOURCE.BUSINESS_SEGMENT_NM,
          CREATE_TS                = SOURCE.CREATE_TS,
          LAST_UPDATE_TS           = SOURCE.LAST_UPDATE_TS,
          SYS_EFF_TS               = SOURCE.SYS_EFF_TS,
          SYS_EXP_TS               = SOURCE.SYS_EXP_TS,
          INGEST_TS                = SOURCE.INGEST_TS,
          DL_LAST_UPDATE_TS        = SOURCE.DL_LAST_UPDATE_TS,
          CHKSUM_STR               = SOURCE.CHKSUM_STR,
          LOAD_TS                  = SOURCE.LOAD_TS,
          DML_ACTION_TYPE_CD       = 'U',
          DBT_SCD_ID               = SOURCE.DBT_SCD_ID,
          CURR_FLG                 = SOURCE.CURR_FLG,
          SOURCE_SYSTEM_NM         = SOURCE.SOURCE_SYSTEM_NM,
          INSTANCE_NM              = SOURCE.INSTANCE_NM,
          ROOT_EXECN_PID           = SOURCE.ROOT_EXECN_PID,
          ADF_PIPELINE_NM          = SOURCE.ADF_PIPELINE_NM,
          ADF_TRANSFORMATION_NM    = SOURCE.ADF_TRANSFORMATION_NM,
          ADF_SCRIPT_NM            = SOURCE.ADF_SCRIPT_NM

      WHEN MATCHED AND SOURCE.CURR_FLG = 'N' THEN
      UPDATE SET
          DML_ACTION_TYPE_CD = 'D',
          SYS_EXP_TS         = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
