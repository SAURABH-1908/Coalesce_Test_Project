name: DBT_FINAL_1
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'EMPLOYEE_DIM') }} AS DBT_INTERNAL_DEST
      USING {{ ref('WORK', 'DBT_FINAL_1') }} AS DBT_INTERNAL_SOURCE
      ON TO_VARCHAR(DBT_INTERNAL_SOURCE.TARGET_PRIMARY_KEY) = TO_VARCHAR(DBT_INTERNAL_DEST.EMPLOYEE_INTG_ID)
      AND TO_VARCHAR(TO_NUMBER(DBT_INTERNAL_SOURCE.EMPLOYEE_SK)) = DBT_INTERNAL_DEST.EMPLOYEE_SK
      AND DBT_INTERNAL_SOURCE.SYS_EFF_TS = DBT_INTERNAL_DEST.SYS_EFF_TS
      WHEN MATCHED AND DBT_INTERNAL_DEST.SYS_EXP_TS IS NULL AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD IN ('D','U')
      THEN UPDATE SET
          SYS_EXP_TS = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
          CURR_FLG = DBT_INTERNAL_SOURCE.CURR_FLG,
          DML_ACTION_TYPE_CD = DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD
      WHEN NOT MATCHED AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD = 'I'
      THEN INSERT (
          EMPLOYEE_INTG_ID,
          EMPLOYEE_SK,
          EMPLOYEE_ID,
          OFFICIAL_EMAIL_TXT,
          SOURCE_SYSTEM_SK,
          EMPLOYEE_NM,
          UTILIZATION_START_DT,
          UTILIZATION_END_DT,
          START_DATE_IN_CURRENT_JOB_CODE_DT,
          END_DATE_IN_CURRENT_FUNCTION_DT,
          ERP_ENTITY_CD,
          LAST_UPDATE_TS,
          CREATE_TS,
          SYS_EFF_TS,
          SYS_EXP_TS,
          INGEST_TS,
          DL_LAST_UPDT_TS,
          CHKSUM_STR,
          LOAD_TS,
          DML_ACTION_TYPE_CD,
          DBT_SCD_ID,
          CURR_FLG,
          SOURCE_SYSTEM_NM,
          INSTANCE_NM,
          ROOT_EXECN_PID,
          ADF_PIPELINE_NM,
          ADF_TRANSFORMATION_NM,
          ADF_SCRIPT_NM,
          BUSINESS_SEGMENT_NM
      )
      VALUES (
          DBT_INTERNAL_SOURCE.EMPLOYEE_INTG_ID,
          TO_NUMBER(DBT_INTERNAL_SOURCE.EMPLOYEE_SK),
          DBT_INTERNAL_SOURCE.EMPLOYEE_ID,
          DBT_INTERNAL_SOURCE.OFFICIAL_EMAIL_TXT,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_SK,
          DBT_INTERNAL_SOURCE.EMPLOYEE_NM,
          DBT_INTERNAL_SOURCE.UTILIZATION_START_DT,
          DBT_INTERNAL_SOURCE.UTILIZATION_END_DT,
          DBT_INTERNAL_SOURCE.START_DATE_IN_CURRENT_JOB_CODE_DT,
          DBT_INTERNAL_SOURCE.END_DATE_IN_CURRENT_FUNCTION_DT,
          DBT_INTERNAL_SOURCE.ERP_ENTITY_CD,
          DBT_INTERNAL_SOURCE.LAST_UPDATE_TS,
          DBT_INTERNAL_SOURCE.CREATE_TS,
          DBT_INTERNAL_SOURCE.SYS_EFF_TS,
          DBT_INTERNAL_SOURCE.SYS_EXP_TS,
          DBT_INTERNAL_SOURCE.INGEST_TS,
          DBT_INTERNAL_SOURCE.DL_LAST_UPDT_TS,
          DBT_INTERNAL_SOURCE.CHKSUM_STR,
          DBT_INTERNAL_SOURCE.LOAD_TS,
          DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD,
          DBT_INTERNAL_SOURCE.DBT_SCD_ID,
          DBT_INTERNAL_SOURCE.CURR_FLG,
          DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_NM,
          DBT_INTERNAL_SOURCE.INSTANCE_NM,
          NULL,
          '${adf_pipeline_nm}',
          '${adf_datafactory_nm}',
          'otc-finance/NA/TFS-SIMPLEX-GRINNELL/LOAD_FNL_BAAN_V_535_EMPLOYEE_DIM.sql',
          'Americas'
      );
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
  database: ""
  deployEnabled: true
