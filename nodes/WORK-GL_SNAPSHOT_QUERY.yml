    sourceMapping:
      - aliases:
          SD: 928d799e-a8af-4d32-b154-7953f6a87726
          TFGLD008: 88d788b7-5075-4e80-998d-940a596d2737
        customSQL:
          customSQL: ""
        dependencies:
          - locationName: SRC
            nodeName: SOURCE_SYSTEM_DIM
          - locationName: SRC
            nodeName: TTFGLD009525
          - locationName: WORK
            nodeName: GL_TFGLD008525
        join:
          joinCondition: |-
            FROM {{ ref('WORK', 'GL_TFGLD008525') }} TFGLD008

            LEFT OUTER JOIN (
              SELECT DISTINCT
                LISTAGG(CONCAT_WS('-', TRIM(T_FDIM), TRIM(T_UDIM)), ',') AS COST_CENTER_CD,
                T_LEAC
              FROM {{ ref('SRC', 'TTFGLD009525') }}
              WHERE TRIM(T_DTYP) = '1.0000000000'
              GROUP BY T_LEAC
            ) TFGLD009
            ON TRIM(TFGLD008.T_LEAC) = TRIM(TFGLD009.T_LEAC)

            LEFT OUTER JOIN {{ ref('SRC', 'SOURCE_SYSTEM_DIM') }} SD
            ON SD.SOURCE_SYSTEM_CD = 'SOURCE_SYSTEM_003'
            AND SD.SITE_REGION_CD = 'INSTANCE_004'
            AND SD.CURR_FLG = 'Y'
            AND TRIM(SD.SOURCE_COMPANY_CD) = TRIM(TFGLD008.COUNTRY_CD)

            QUALIFY ROW_NUMBER() OVER (
              PARTITION BY CONCAT_WS('~', COALESCE(TRIM(TFGLD008.T_LEAC), ''), '525', 'INSTANCE_004', 'SOURCE_SYSTEM_003')
              ORDER BY TFGLD008.T_LEAC
            ) = 1
        name: GL_SNAPSHOT_QUERY
        noLinkRefs: []
