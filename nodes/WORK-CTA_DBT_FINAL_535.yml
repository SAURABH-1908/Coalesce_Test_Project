name: CTA_DBT_FINAL_535
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      --#################### MERGE using UNION of ALL INSERTs, UPDATES and DELETEs #########################

      MERGE INTO {{ ref_no_link('TARGET', 'CONTRACT_TO_ADDRESS_BRIDGE') }} AS target
      USING (
      	select * from {{ ref('WORK', 'CTA_DBT_FINAL_535') }}
      ) SOURCE

      ------------------------------- MERGE Starts--------------------------------------------

      on TO_VARCHAR(SOURCE.Target_Primary_Key) = TO_VARCHAR(target.CONTRACT_TO_ADDRESS_INTG_ID)
      and TO_NUMBER(SOURCE.CONTRACT_TO_ADDRESS_SK) = TO_NUMBER(target.CONTRACT_TO_ADDRESS_SK)
      and SOURCE.sys_eff_ts = target.sys_eff_ts
      	when matched and target.SYS_EXP_TS is null and SOURCE.dml_action_type_cd in('D','U')
      	then update set 
      		SYS_EXP_TS = to_timestamp_ntz(convert_timezone('UTC', current_timestamp())),
      		CURR_FLG = SOURCE.CURR_FLG,
      		DML_ACTION_TYPE_CD = SOURCE.dml_action_type_cd
      		
      	when not matched and SOURCE.dml_action_type_cd = 'I'
      	then insert 
      (
      		CONTRACT_TO_ADDRESS_SK,
      		CONTRACT_TO_ADDRESS_INTG_ID, 
              ADDRESS_SK,
              CONTRACT_SK,
              BUSINESS_SEGMENT_NM,
      		CREATE_TS,
      		LAST_UPDATE_TS,		
      		SYS_EFF_TS,
      		SYS_EXP_TS,
      		INGEST_TS,
      		DL_LAST_UPDATE_TS,
      		CHKSUM_STR,
      		LOAD_TS,
      		DML_ACTION_TYPE_CD,
      		DBT_SCD_ID,
      		CURR_FLG,
      		SOURCE_SYSTEM_NM,
      		INSTANCE_NM,
              ROOT_EXECN_PID,
      		ADF_PIPELINE_NM,
      		ADF_TRANSFORMATION_NM, 
      		ADF_SCRIPT_NM
      )	
      VALUES 
      (
      		TO_NUMBER(SOURCE.CONTRACT_TO_ADDRESS_SK),      
      		SOURCE.CONTRACT_TO_ADDRESS_INTG_ID, 
      		SOURCE.ADDRESS_SK,
              SOURCE.CONTRACT_SK,
              SOURCE.BUSINESS_SEGMENT_NM,
      		SOURCE.CREATE_TS,
      		SOURCE.LAST_UPDATE_TS,		
      		SOURCE.SYS_EFF_TS,
      		SOURCE.SYS_EXP_TS,
      		SOURCE.INGEST_TS,
      		SOURCE.DL_LAST_UPDATE_TS,
      		SOURCE.CHKSUM_STR,
      		SOURCE.LOAD_TS,
      		SOURCE.DML_ACTION_TYPE_CD,
      		SOURCE.DBT_SCD_ID,
      		SOURCE.CURR_FLG,
      		SOURCE.SOURCE_SYSTEM_NM,
      		SOURCE.INSTANCE_NM,
              SOURCE.ROOT_EXECN_PID,
      		SOURCE.ADF_PIPELINE_NM,
      		SOURCE.ADF_TRANSFORMATION_NM,
      		SOURCE.ADF_SCRIPT_NM
      );
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
  database: ""
  deployEnabled: true
