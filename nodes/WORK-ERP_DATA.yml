              AND trim(cisli205.T_idoc) = trim(cisli210.T_idoc)
            LEFT JOIN {{ ref('SRC', 'TCISLI225525') }} as cisli225
              ON trim(cisli205.T_ityp) = trim(cisli225.T_ityp)
              AND trim(cisli205.T_idoc) = trim(cisli225.T_idoc)
            LEFT JOIN {{ ref('SRC', 'TCISLI265525') }} as cisli265
              ON trim(cisli205.T_ityp) = trim(cisli265.T_ityp)
              AND trim(cisli205.T_idoc) = trim(cisli265.T_idoc)
