              from {{ ref('SRC', 'TCISLI235525') }} a
              LEFT OUTER JOIN {{ ref('SRC', 'TTPPDM600525') }} b on trim(b.T_CPRJ) = trim(a.T_CPRJ)
              LEFT OUTER JOIN {{ ref('SRC', 'GEOGRAPHY_DIM') }} c on trim(c.BRANCH_CD) = trim(b.T_CREG)
              where c.source_system_nm = 'SOURCE_SYSTEM_002' AND c.instance_nm = 'INSTANCE_004'
                and c.CURR_FLG = 'Y' and c.company_cd = '525'
            ) geo on trim(cisli235.T_CPRJ) = trim(geo.T_CPRJ)
            LEFT OUTER JOIN {{ ref('SRC', 'GL_ACCOUNT_DIM') }} as GL_ACCOUNT
              on trim(tfgld106.T_leac) = trim(GL_ACCOUNT.src_account_cd)
              and GL_ACCOUNT.source_system_nm = 'SOURCE_SYSTEM_002' AND GL_ACCOUNT.instance_nm = 'INSTANCE_004'
