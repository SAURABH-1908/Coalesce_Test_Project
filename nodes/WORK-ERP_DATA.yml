              from {{ ref('SRC', 'TCISLI205525') }} c
              LEFT JOIN {{ ref('SRC', 'TCISLI235525') }} b
                ON TRIM(c.T_ityp) = TRIM(b.T_ityp) AND TRIM(c.T_IDOC) = TRIM(b.T_IDOC)
              LEFT JOIN {{ ref('SRC', 'ITEM_DIM') }} a
                ON TRIM(a.source_item_nbr) = TRIM(b.T_ITEM)
                AND a.source_system_nm = 'SOURCE_SYSTEM_002' AND a.instance_nm = 'INSTANCE_004'
                AND a.CURR_FLG = 'Y' AND a.ENTITY_CD = '525'
            ) item ON TRIM(item.T_ityp) = TRIM(cisli205.T_ityp) AND TRIM(item.T_IDOC) = TRIM(cisli205.T_IDOC)
            LEFT JOIN {{ ref('SRC', 'TCISLI245525') }} AS cisli245
