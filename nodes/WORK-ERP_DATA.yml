                DFR_c.bos_description AS OS_CONTRACT_TYPE_DSC, DFR_c.target_code AS OS_CONTRACT_TYPE_CD,
                ttppdm600.T_CPRJ, tsicdb005.T_FAMI
              FROM {{ ref('SRC', 'TTPPDM600525') }} ttppdm600
              LEFT OUTER JOIN (
