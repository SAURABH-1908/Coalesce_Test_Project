              FROM {{ ref('SRC', 'CUSTOMER_DIM') }} AS T1
              WHERE T1.source_system_nm = 'SOURCE_SYSTEM_001' AND T1.instance_nm = 'INSTANCE_001'
                AND T1.CURR_FLG = 'Y' and T1.company_cd = '525'
            ) CUS_SK ON TRIM(CUS_SK.CUSTOMER_NUMBER) = TRIM(tfacr200.T_ITBP)
            LEFT JOIN (
              SELECT coalesce(T1.CUSTOMER_SK, '99999') AS SHIP_TO_CUSTOMER_SK, T2.T_BPID
              FROM {{ ref('SRC', 'TTCCOM111525') }} AS T2
              LEFT JOIN {{ ref('SRC', 'CUSTOMER_DIM') }} AS T1 ON TRIM(T1.CUSTOMER_NUMBER) = TRIM(T2.T_BPID)
              WHERE T1.source_system_nm = 'SOURCE_SYSTEM_001' AND T1.instance_nm = 'INSTANCE_001'
                AND T1.CURR_FLG = 'Y' and T1.company_cd = '525'
            ) Ship_cus_sk ON TRIM(Ship_cus_sk.T_BPID) = TRIM(cisli205.T_STBP)
            LEFT JOIN (
              SELECT coalesce(T1.CUSTOMER_SK, '99999') AS BILL_TO_CUSTOMER_SK, T2.T_ITBP
              FROM {{ ref('SRC', 'TTCCOM112525') }} AS T2
              LEFT JOIN {{ ref('SRC', 'CUSTOMER_DIM') }} AS T1 ON TRIM(T1.CUSTOMER_NUMBER) = TRIM(T2.T_ITBP)
              WHERE T1.source_system_nm = 'SOURCE_SYSTEM_001' AND T1.instance_nm = 'INSTANCE_001'
                AND T1.CURR_FLG = 'Y' and T1.company_cd = '525'
            ) BILL_TO_CUS ON TRIM(BILL_TO_CUS.T_ITBP) = TRIM(cisli205.T_ITBP)
            LEFT JOIN {{ ref('SRC', 'GBL_ADDRESS_DIM') }} AS GBL_ADDRESS_DIM_BILL_TO
              ON 1 = 0
            LEFT JOIN {{ ref('SRC', 'GBL_ADDRESS_DIM') }} AS GBL_ADDRESS_DIM_SHIP_TO
              ON 1 = 0
            LEFT JOIN {{ ref('SRC', 'GBL_ADDRESS_DIM') }} AS GBL_ADDRESS_DIM_SOLD_TO
              ON 1 = 0
            LEFT JOIN (
