            FROM {{ ref('SRC', 'TTFACR200525') }} AS tfacr200
            LEFT JOIN {{ ref('SRC', 'TCISLI205525') }} AS cisli205
              ON TRIM(tfacr200.T_ttyp) = TRIM(cisli205.T_ityp)
              AND floor(TRIM(tfacr200.T_ninv)) = TRIM(cisli205.T_IDOC)
              AND trim(tfacr200.T_lino) = 0
            LEFT OUTER JOIN {{ ref('SRC', 'CURRENCY_DIM') }} cur
