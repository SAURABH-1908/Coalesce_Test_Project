                FROM {{ ref('SRC', 'TSICDB005525') }}
                QUALIFY row_number() over (partition by T_PROJ order by T_TOTS DESC) = 1
              ) tsicdb005 ON tsicdb005.T_PROJ = ttppdm600.T_CPRJ AND to_date(tsicdb005.T_SSDT) <> '1970-01-01'
              INNER JOIN {{ ref('SRC', 'DFR_LOOKUP') }} DFR_e
