name: GL_DBT_FINAL_535
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'GL_ACCOUNT_DIM') }} AS DBT_INTERNAL_DEST
      USING {{ ref('WORK', 'GL_DBT_FINAL_535') }} AS DBT_INTERNAL_SOURCE
          ON TO_VARCHAR(DBT_INTERNAL_SOURCE.ACCOUNT_INTG_ID) = TO_VARCHAR(DBT_INTERNAL_DEST.ACCOUNT_INTG_ID)
         AND TO_NUMBER(DBT_INTERNAL_SOURCE.GL_ACCOUNT_SK)   = TO_NUMBER(DBT_INTERNAL_DEST.GL_ACCOUNT_SK)
         AND DBT_INTERNAL_SOURCE.SYS_EFF_TS = DBT_INTERNAL_DEST.SYS_EFF_TS

      WHEN MATCHED
           AND DBT_INTERNAL_DEST.SYS_EXP_TS IS NULL
           AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD IN ('D','U')
      THEN UPDATE SET
              SYS_EXP_TS         = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
              CURR_FLG           = DBT_INTERNAL_SOURCE.CURR_FLG,
              DML_ACTION_TYPE_CD = DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD

      WHEN NOT MATCHED
           AND DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD = 'I'
      THEN INSERT (
              GL_ACCOUNT_SK, ACCOUNT_INTG_ID, SRC_ACCOUNT_CD, SRC_ACCOUNT_DSC, ACCOUNT_CD,
              ACCOUNT_DSC, ACCOUNT_TYPE_DSC, ENABLED_FLG, REVENUE_COST_FLG, ERP_ENTITY_CD,
              THIRD_PARTY_FLG, COST_CENTER_CD, BUSINESS_UNIT_NM, DEBIT_FLG, ACCOUNT_TYPE_CD,
              PARENT_ACCOUNT_CD, STATUS_CD, STATUS_DSC, BUSINESS_SEGMENT_NM, SOURCE_SYSTEM_SK,
              CREATE_TS, LAST_UPDATE_TS, SYS_EFF_TS, SYS_EXP_TS, INGEST_TS, DL_LAST_UPDATE_TS,
              CHKSUM_STR, LOAD_TS, DML_ACTION_TYPE_CD, DBT_SCD_ID, CURR_FLG, SOURCE_SYSTEM_NM,
              INSTANCE_NM
      )
      VALUES (
              TO_NUMBER(DBT_INTERNAL_SOURCE.GL_ACCOUNT_SK), DBT_INTERNAL_SOURCE.ACCOUNT_INTG_ID,
              DBT_INTERNAL_SOURCE.SRC_ACCOUNT_CD, DBT_INTERNAL_SOURCE.SRC_ACCOUNT_DSC, DBT_INTERNAL_SOURCE.ACCOUNT_CD,
              DBT_INTERNAL_SOURCE.ACCOUNT_DSC, DBT_INTERNAL_SOURCE.ACCOUNT_TYPE_DSC, DBT_INTERNAL_SOURCE.ENABLED_FLG,
              DBT_INTERNAL_SOURCE.REVENUE_COST_FLG, DBT_INTERNAL_SOURCE.ERP_ENTITY_CD, DBT_INTERNAL_SOURCE.THIRD_PARTY_FLG,
              DBT_INTERNAL_SOURCE.COST_CENTER_CD, DBT_INTERNAL_SOURCE.BUSINESS_UNIT_NM, DBT_INTERNAL_SOURCE.DEBIT_FLG,
              DBT_INTERNAL_SOURCE.ACCOUNT_TYPE_CD, DBT_INTERNAL_SOURCE.PARENT_ACCOUNT_CD, DBT_INTERNAL_SOURCE.STATUS_CD,
              DBT_INTERNAL_SOURCE.STATUS_DSC, DBT_INTERNAL_SOURCE.BUSINESS_SEGMENT_NM, DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_SK,
              DBT_INTERNAL_SOURCE.CREATE_TS, DBT_INTERNAL_SOURCE.LAST_UPDATE_TS, DBT_INTERNAL_SOURCE.SYS_EFF_TS,
              DBT_INTERNAL_SOURCE.SYS_EXP_TS, DBT_INTERNAL_SOURCE.INGEST_TS, DBT_INTERNAL_SOURCE.DL_LAST_UPDATE_TS,
              DBT_INTERNAL_SOURCE.CHKSUM_STR, DBT_INTERNAL_SOURCE.LOAD_TS, DBT_INTERNAL_SOURCE.DML_ACTION_TYPE_CD,
              DBT_INTERNAL_SOURCE.DBT_SCD_ID, DBT_INTERNAL_SOURCE.CURR_FLG, DBT_INTERNAL_SOURCE.SOURCE_SYSTEM_NM,
              DBT_INTERNAL_SOURCE.INSTANCE_NM
      )
      ;
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
  database: ""
  deployEnabled: true
