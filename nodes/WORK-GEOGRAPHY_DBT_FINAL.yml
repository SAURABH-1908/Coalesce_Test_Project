name: GEOGRAPHY_DBT_FINAL
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO {{ ref('TARGET', 'GEOGRAPHY_DIM') }} AS TARGET
      USING {{ ref('WORK', 'GEOGRAPHY_DBT_FINAL') }} AS SOURCE
          ON TO_VARCHAR(SOURCE.TARGET_PRIMARY_KEY) = TO_VARCHAR(TARGET.GEOGRAPHY_INTG_ID)
         AND TO_VARCHAR(TO_NUMBER(SOURCE.GEO_SK)) = TARGET.GEO_SK
         AND SOURCE.SYS_EFF_TS = TARGET.SYS_EFF_TS
      WHEN MATCHED AND TARGET.SYS_EXP_TS IS NULL AND SOURCE.DML_ACTION_TYPE_CD IN ('D','U')
          THEN UPDATE SET
              SYS_EXP_TS         = TO_TIMESTAMP_NTZ(CONVERT_TIMEZONE('UTC', CURRENT_TIMESTAMP())),
              CURR_FLG           = SOURCE.CURR_FLG,
              DML_ACTION_TYPE_CD = SOURCE.DML_ACTION_TYPE_CD
      WHEN NOT MATCHED AND SOURCE.DML_ACTION_TYPE_CD = 'I'
          THEN INSERT (
              GEO_SK, GEOGRAPHY_INTG_ID, COUNTRY_NM, BRANCH_CD, BRANCH_NM, REGION_CD, REGION_NM,
              COUNTRY_CD, DISTRICT_CD, DISTRICT_NM, DOMAIN_NM, COMPANY_CD, CITY_NM, STATE_ID, ZIP_CD,
              INSTALL_FLG, SERVICE_FLG, BRANCH_ID, COMPANY_NM, BRANCH_STATUS_CD, BUS_UNIT_CD, BUS_UNIT_NM,
              BUSINESS_SEGMENT_NM, SOURCE_SYSTEM_SK, CREATE_TS, LAST_UPDATE_TS, SYS_EFF_TS, SYS_EXP_TS,
              INGEST_TS, DL_LAST_UPDATE_TS, CHKSUM_STR, LOAD_TS, DML_ACTION_TYPE_CD, DBT_SCD_ID, CURR_FLG,
              SOURCE_SYSTEM_NM, INSTANCE_NM, ROOT_EXECN_PID, ADF_PIPELINE_NM, ADF_TRANSFORMATION_NM, ADF_SCRIPT_NM
          )
          VALUES (
              TO_NUMBER(SOURCE.GEO_SK), SOURCE.GEOGRAPHY_INTG_ID, SOURCE.COUNTRY_NM, SOURCE.BRANCH_CD,
              SOURCE.BRANCH_NM, SOURCE.REGION_CD, SOURCE.REGION_NM, SOURCE.COUNTRY_CD, SOURCE.DISTRICT_CD,
              SOURCE.DISTRICT_NM, SOURCE.DOMAIN_NM, SOURCE.COMPANY_CD, SOURCE.CITY_NM, SOURCE.STATE_ID,
              SOURCE.ZIP_CD, SOURCE.INSTALL_FLG, SOURCE.SERVICE_FLG, SOURCE.BRANCH_ID, SOURCE.COMPANY_NM,
              SOURCE.BRANCH_STATUS_CD, SOURCE.BUS_UNIT_CD, SOURCE.BUS_UNIT_NM, SOURCE.BUSINESS_SEGMENT_NM,
              SOURCE.SOURCE_SYSTEM_SK, SOURCE.CREATE_TS, SOURCE.LAST_UPDATE_TS, SOURCE.SYS_EFF_TS,
              SOURCE.SYS_EXP_TS, SOURCE.INGEST_TS, SOURCE.DL_LAST_UPDATE_TS, SOURCE.CHKSUM_STR, SOURCE.LOAD_TS,
              SOURCE.DML_ACTION_TYPE_CD, SOURCE.DBT_SCD_ID, SOURCE.CURR_FLG, SOURCE.SOURCE_SYSTEM_NM,
              SOURCE.INSTANCE_NM, SOURCE.ROOT_EXECN_PID, SOURCE.ADF_PIPELINE_NM, SOURCE.ADF_TRANSFORMATION_NM,
              SOURCE.ADF_SCRIPT_NM
          );
    preSQL: ""
    testsEnabled: true
    truncateBefore: true
